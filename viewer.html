<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:transparent}

  .stage{height:100%;padding:clamp(10px,3.5vmin,30px);display:flex}

  .note{
    --paper:#ffb8d0; --ink:#24222b; --hl:#ffea3d;
    flex:1; min-width:0; min-height:0; display:flex;
    background-color:var(--paper);
    background-image:
      linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,0) 7%),
      linear-gradient(155deg, rgba(255,255,255,.4), rgba(255,255,255,0) 42%, rgba(0,0,0,.05));
    color:var(--ink);
    border-radius:2px 2px 10px 2px;
    box-shadow:0 1px 1px rgba(0,0,0,.14), 0 10px 12px -6px rgba(0,0,0,.28), 0 24px 28px -14px rgba(0,0,0,.30);
    opacity:0; transition:opacity .4s ease;
  }
  .note.ready{opacity:1}
  @media (prefers-reduced-motion:reduce){.note{transition:none}}
  .note[data-paper="mint"]{--paper:#b5efcb}
  .note[data-paper="sky"]{--paper:#b3ddfa}
  .note[data-paper="lilac"]{--paper:#d8c9ff}
  .note[data-paper="orange"]{--paper:#ffcb98}

  .scroll{
    flex:1; min-width:0; overflow-y:auto; overflow-x:hidden;
    scrollbar-width:thin; scrollbar-color:rgba(0,0,0,.28) transparent;
  }
  .note-body{
    padding:1.7em 1.35em 1.7em; min-height:100%;
    font-family:'Kalam','Segoe Print','Bradley Hand','Comic Sans MS',cursive;
    font-size:clamp(17px,4.4vw,25px); line-height:1.5;
    overflow-wrap:anywhere;
  }
  .note-body b{font-weight:700}
  .note-body mark{
    background:var(--hl); color:inherit;
    padding:0 .12em; margin:0 -.04em; border-radius:.2em;
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
  }
  .note-body img.photo{
    display:block; max-width:100%; height:auto; margin:.7em auto;
    padding:.35em; background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    transform:rotate(-1.2deg);
  }
  .note-body img.photo:nth-of-type(even){transform:rotate(1deg)}
  .msg{opacity:.7}
</style>
</head>
<body>
  <main class="stage">
    <article class="note" id="note" data-paper="pink" aria-label="Note">
      <div class="scroll"><div class="note-body" id="body"></div></div>
    </article>
  </main>

<script>
(function () {
  'use strict';

  var PAPERS = ['pink', 'mint', 'sky', 'lilac', 'orange'];
  var DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','LINK','META','NOSCRIPT',
                      'SVG','MATH','FORM','INPUT','BUTTON','TEXTAREA','SELECT','VIDEO','AUDIO',
                      'CANVAS','TITLE','HEAD']);
  var IMG_OK = /^data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;

  // Rebuilds content from scratch, keeping only bold, highlight, line breaks and inline images.
  function clean(src) {
    var out = document.createDocumentFragment();
    Array.prototype.slice.call(src.childNodes).forEach(function (n) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      var tag = n.tagName.toUpperCase();
      if (DROP.has(tag)) return;

      if (tag === 'IMG') {
        var s = n.getAttribute('src') || '';
        if (IMG_OK.test(s)) {
          var img = document.createElement('img');
          img.className = 'photo'; img.alt = 'Attached image'; img.src = s;
          out.appendChild(img);
        }
        return;
      }
      if (tag === 'BR') { out.appendChild(document.createElement('br')); return; }

      // Formatting can arrive as tags (<b>, <mark>) or as inline styles (browsers use both).
      var st = n.style || {}, bg = st.backgroundColor || '', fw = st.fontWeight || '';
      var isMark = tag === 'MARK' || (!!bg && !/^(transparent|rgba\(0,\s*0,\s*0,\s*0\))$/.test(bg));
      var isBold = fw ? (fw === 'bold' || fw === 'bolder' || parseInt(fw, 10) >= 600)
                      : (tag === 'B' || tag === 'STRONG');
      var block = tag === 'DIV' || tag === 'P';

      var node = clean(n);
      if (isBold) { var b = document.createElement('b'); b.appendChild(node); node = b; }
      if (isMark) { var m = document.createElement('mark'); m.appendChild(node); node = m; }
      if (block) { var d = document.createElement('div'); d.appendChild(node); node = d; }
      out.appendChild(node);
    });
    return out;
  }

  var note = document.getElementById('note');
  var body = document.getElementById('body');

  function show(html, paper) {
    note.setAttribute('data-paper', PAPERS.indexOf(paper) > -1 ? paper : 'pink');
    var doc = new DOMParser().parseFromString(html, 'text/html');
    body.textContent = '';
    body.appendChild(clean(doc.body));
    note.classList.add('ready');
  }

  function showError() {
    body.innerHTML = '<div class="msg">This note isn\u2019t available right now.</div>';
    note.classList.add('ready');
  }

  fetch('note.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      if (!data || typeof data.html !== 'string') throw new Error('bad note');
      show(data.html, data.paper);
    })
    .catch(showError);
})();
</script>
</body>
</html>
